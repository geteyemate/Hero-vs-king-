<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickman Epic Fight</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="reel-container">
        <!-- Pure Cinematic Stickman Arena -->
        <div class="arena">
            <!-- Hero Stickman -->
            <div id="hero" class="stickman hero">
                <div class="head"></div>
                <div class="body"></div>
                <div class="arms"></div>
                <div class="legs"></div>
                <div class="sword"></div>
            </div>

            <!-- Clash Spark Effect -->
            <div id="spark" class="spark">⚡</div>

            <!-- Demon King Stickman -->
            <div id="demon" class="stickman demon">
                <div class="head"></div>
                <div class="body"></div>
                <div class="arms"></div>
                <div class="legs"></div>
                <div class="horns"></div>
            </div>
        </div>

        <div class="watermark">@vinjex.dev</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
