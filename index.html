<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero vs Demon King</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="reel-container">
        <div class="hud">
            <div class="fighter-info">
                <span>HERO</span>
                <div class="hp-bar"><div id="hero-hp" class="hp-fill"></div></div>
            </div>
            <div class="vs">VS</div>
            <div class="fighter-info right">
                <span>DEMON KING</span>
                <div class="hp-bar"><div id="demon-hp" class="hp-fill"></div></div>
            </div>
        </div>

        <div class="arena">
            <div id="hero" class="fighter hero">⚔️</div>
            <div id="demon" class="fighter demon">👹</div>
        </div>

        <div class="watermark">@vinjex.dev</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
