<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epic Anime Fight</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="reel-container">
        <!-- Cinematic Battle Scene -->
        <div class="sky">
            <div class="stars"></div>
        </div>

        <div class="arena">
            <!-- Hero Character with Cape & Sword -->
            <div id="hero" class="fighter hero">
                <div class="cape"></div>
                <div class="head"></div>
                <div class="body"></div>
                <div class="arm left"></div>
                <div class="arm right"><div class="sword"></div></div>
                <div class="leg left"></div>
                <div class="leg right"></div>
            </div>

            <!-- Energy / Magic Projectiles -->
            <div id="hero-blast" class="energy-blast hero-blast"></div>
            <div id="demon-blast" class="energy-blast demon-blast"></div>
            <div id="impact-effect" class="impact">💥</div>

            <!-- Demon King Character with Horns & Aura -->
            <div id="demon" class="fighter demon">
                <div class="horns"></div>
                <div class="head"></div>
                <div class="body"></div>
                <div class="arm left"></div>
                <div class="arm right"></div>
                <div class="leg left"></div>
                <div class="leg right"></div>
            </div>
        </div>

        <!-- Solid Ground Floor -->
        <div class="ground"></div>

        <div class="watermark">@vinjex.dev</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
